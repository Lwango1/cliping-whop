<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipping Whop</title>
    <link rel="manifest" href="/assets/manifest.json">
    <link rel="icon" href="/assets/icons/icon-48x48.png" sizes="48x48">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffd700">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0e1a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; }
        .auth-box { background: #141b2d; border: 1px solid #1e2a45; border-radius: 16px; padding: 40px; max-width: 420px; width: 100%; margin: 0 auto; }
        .auth-box h1 { color: #ffd700; font-size: 24px; margin-bottom: 4px; }
        .auth-box .sub { color: #8892b0; font-size: 14px; margin-bottom: 24px; }
        .form-control { background: #1a2340; border: 1px solid #2a3655; color: #e0e0e0; }
        .form-control:focus { background: #1a2340; border-color: #ffd700; color: #e0e0e0; box-shadow: 0 0 0 0.2rem rgba(255,215,0,0.15); }
        .btn-gold { background: #ffd700; color: #0a0e1a; font-weight: 600; border: none; padding: 10px; }
        .btn-gold:hover { background: #e6c200; color: #0a0e1a; }
        .alert { background: #1a2340; border: 1px solid #2a3655; color: #e0e0e0; }
        .logo { font-size: 40px; margin-bottom: 8px; }
        .tabs { display: flex; margin-bottom: 24px; background: #1a2340; border-radius: 8px; overflow: hidden; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: #8892b0; font-weight: 500; transition: all 0.2s; }
        .tab.active { background: #ffd700; color: #0a0e1a; font-weight: 600; }
        .tab:not(.active):hover { background: #2a3655; color: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-box">
            <div class="text-center logo">⚽</div>
            <h1 class="text-center">Clipping Whop</h1>
            <p class="sub text-center">Creez et publiez du contenu automatiquement</p>
            
            <div class="tabs">
                <div id="tabLogin" class="tab active" onclick="showLogin()">Connexion</div>
                <div id="tabRegister" class="tab" onclick="showRegister()">Inscription</div>
            </div>

            <div id="loginAlert" class="alert alert-danger d-none"></div>
            <div id="registerAlert" class="alert alert-danger d-none"></div>

            <!-- Login Form -->
            <div id="loginForm">
                <div class="mb-3">
                    <label class="form-label" style="color:#8892b0;font-size:13px">Nom d'utilisateur</label>
                    <input id="loginUsername" class="form-control" placeholder="Ex: john, user123">
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color:#8892b0;font-size:13px">Mot de passe</label>
                    <input id="loginPassword" type="password" class="form-control" placeholder="Votre mot de passe">
                </div>
                <button id="loginBtn" class="btn btn-gold w-100 mb-2">Se connecter</button>
                <p class="text-center mb-0" style="color:#8892b0;font-size:13px">
                    Pas encore de compte ? <span class="tab-link" onclick="showRegister()" style="color:#ffd700;cursor:pointer;text-decoration:underline">Creer un compte</span>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="d-none">
                <div class="mb-3">
                    <label class="form-label" style="color:#8892b0;font-size:13px">Nom d'utilisateur</label>
                    <input id="regUsername" class="form-control" placeholder="Ex: john, user123">
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color:#8892b0;font-size:13px">Adresse email</label>
                    <input id="regEmail" class="form-control" placeholder="Ex: john@email.com">
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color:#8892b0;font-size:13px">Mot de passe (min 6 caracteres)</label>
                    <input id="regPassword" type="password" class="form-control" placeholder="Ex: monMotDePasse123">
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color:#8892b0;font-size:13px">Confirmer le mot de passe</label>
                    <input id="regPassword2" type="password" class="form-control" placeholder="Tapez le meme mot de passe">
                </div>
                <button id="registerBtn" class="btn btn-gold w-100 mb-2">Creer mon compte</button>
                <p class="text-center mb-0" style="color:#8892b0;font-size:13px">
                    Deja un compte ? <span class="tab-link" onclick="showLogin()" style="color:#ffd700;cursor:pointer;text-decoration:underline">Se connecter</span>
                </p>
            </div>
        </div>
    </div>

    <script>
        function showLogin() {
            document.getElementById('loginForm').classList.remove('d-none');
            document.getElementById('registerForm').classList.add('d-none');
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('tabRegister').classList.remove('active');
        }
        function showRegister() {
            document.getElementById('registerForm').classList.remove('d-none');
            document.getElementById('loginForm').classList.add('d-none');
            document.getElementById('tabRegister').classList.add('active');
            document.getElementById('tabLogin').classList.remove('active');
        }

        function alert(el, msg) { 
            const a = document.getElementById(el); 
            a.textContent = msg; 
            a.classList.remove('d-none'); 
            setTimeout(() => a.classList.add('d-none'), 4000); 
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) return alert('loginAlert', 'Veuillez remplir tous les champs');
            try {
                const r = await fetch('/api/login', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ username, password }) 
                });
                if (!r.ok) { const e = await r.json(); return alert('loginAlert', e.detail || 'Identifiants incorrects'); }
                const data = await r.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                window.location.href = '/app';
            } catch (e) { alert('loginAlert', 'Erreur de connexion au serveur'); }
        });

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;
            if (!username || !email || !password) return alert('registerAlert', 'Veuillez remplir tous les champs');
            if (password !== password2) return alert('registerAlert', 'Les mots de passe ne correspondent pas');
            if (password.length < 6) return alert('registerAlert', 'Mot de passe trop court (min 6 caracteres)');
            try {
                const r = await fetch('/api/register', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ username, email, password }) 
                });
                if (!r.ok) { const e = await r.json(); return alert('registerAlert', e.detail || 'Erreur lors de l inscription'); }
                const data = await r.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                window.location.href = '/app';
            } catch (e) { alert('registerAlert', 'Erreur de connexion au serveur'); }
        });

        document.getElementById('loginUsername').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
        document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
        document.getElementById('regPassword2').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('registerBtn').click(); });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/assets/sw.js');
        }
    </script>
</body>
</html>
